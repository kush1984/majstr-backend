name: Build & test

# The test gate. Until this existed, NOTHING automatically compiled or tested a
# commit: the Dockerfile builds the deploy image with `-x check -x test`, so a
# commit whose tests don't even COMPILE could (and did) reach master unnoticed.
#
# Runs the same command the contributor guide asks for locally — `./gradlew build`
# — which compiles main + test, runs the full suite, and fails on the first error.
#
# No secrets and no database are needed: the suite is Mockito-only (see the
# open question about a Testcontainers integration slice — when that lands, a
# `services: postgres` block goes here).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless — cancel it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # matches the toolchain in build.gradle.kts
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4   # dependency + build caching

      - name: Build and test
        # The integration slice starts its own PostgreSQL via Testcontainers, so no
        # `services:` block is needed — ubuntu-latest runners ship a working Docker
        # daemon. Its Spring context reads app.jwt.secret from application-test.yml,
        # so no secrets are needed either.
        run: ./gradlew build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
