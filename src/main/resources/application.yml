spring:
  application:
    name: majstr-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/majstr}
    username: ${DB_USERNAME:majstr}
    password: ${DB_PASSWORD:majstr}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Batch bulk inserts into few multi-row round-trips instead of one per
          # row. Registration seeds a fresh catalog from ~1900 templates (all
          # trades) via saveAll — unbatched that is ~1900 INSERT round-trips and
          # minutes of latency against a managed Postgres. IDs are application-
          # assigned UUIDs so batching engages (IDENTITY generation would disable
          # it). order_inserts groups same-table inserts so a batch stays contiguous.
          batch_size: 100
        order_inserts: true
        order_updates: true
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  # Railway (and most PaaS) inject the listen port via $PORT — bind it so the
  # platform's health/router reaches the app. Falls back to 8080 locally.
  port: ${PORT:8080}
  # Let in-flight requests finish on redeploy instead of being cut mid-response.
  # This app has genuinely slow endpoints — PDF rendering and the LLM imports run
  # for seconds — so an abrupt kill lands on a master as a failed import they have
  # to redo, and (for a payment webhook) as a delivery we never answered.
  shutdown: graceful

spring.lifecycle:
  # Cap on that drain window; past it the remaining requests are dropped anyway.
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        # Only health is reachable — no env/beans/mappings leak.
        include: health
  endpoint:
    health:
      # Never expose component details (DB url, validation queries) to anonymous
      # callers. The aggregate status still reflects every indicator, so a DB
      # outage flips the top-level status to DOWN without leaking internals.
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness fails when the DB is unreachable so an orchestrator stops
        # routing traffic to a pod that can't serve requests.
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true

spring.servlet.multipart:
  # 15 MB covers a designer's PDF sheet (project import) and a phone photo
  # (estimate/receipt/sketch import). Each import enforces its own tighter cap
  # in code (logo ≤2 MB, photos ≤10 MB), so this ceiling doesn't weaken them.
  max-file-size: 15MB
  max-request-size: 18MB

app:
  jwt:
    # HS256 requires >= 32 bytes (256 bits). Set via env in all environments.
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    # Session length for the contractor (a daily work tool). Safe to keep long
    # because refresh tokens rotate on every use. Override with REFRESH_TOKEN_TTL_DAYS.
    refresh-token-expiration-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    # A just-rotated refresh token stays redeemable this long, so a rotation whose RESPONSE
    # was lost (bad signal on site, or a second tab racing) doesn't end the session and take
    # the master's unsynced offline queue with it. Set to 0 for strict single-use rotation.
    refresh-rotation-grace-seconds: ${REFRESH_ROTATION_GRACE_SECONDS:60}
    issuer: majstr-backend
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 15
    register:
      max-attempts: 5
      window-minutes: 60
    forgot:
      max-attempts: 5
      window-minutes: 60
    portal:
      max-attempts: 30
      window-minutes: 1
    verification:
      cooldown-seconds: 60
    estimate-email:
      max-per-hour: 20
  storage:
    # local = filesystem (dev default); s3 = any S3-compatible store (Cloudflare R2).
    kind: ${STORAGE_KIND:local}
    local:
      directory: ${STORAGE_DIR:./data/uploads}
    s3:
      # Only read when kind=s3. Credentials are env only, blank in dev.
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      region: ${R2_REGION:auto}
  portal:
    public-base-url: ${PORTAL_BASE_URL:http://localhost:8080}
  email:
    # Resend API key — env only, blank in local dev (then email is logged & skipped).
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${EMAIL_FROM:Majstr <onboarding@resend.dev>}
    # Base URL of the PWA — the verify link points here: {app-url}/verify-email?token=...
    app-url: ${APP_URL:http://localhost:5173}
  push:
    # Web Push (VAPID). Keys are env only and blank in local dev (then a push is
    # logged & skipped). Generate a stable keypair once for production — rotating
    # it invalidates every existing browser subscription. See README.
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:admin@majstr.app}
  anthropic:
    # Claude API for the estimate-import LLM extraction (Excel/photo → estimate).
    # The key is env only and blank in local dev — then the import feature reports
    # "unavailable" (503) instead of running, since the call is synchronous. Opus 4.8
    # is chosen for table/number OCR accuracy; the uploaded file is never persisted.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-8}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:8000}
  sentry:
    # Error monitoring. DSN is env only and blank in local dev (then Sentry is
    # disabled — nothing is sent, no noise). PII is never sent (send-default-pii
    # stays off); only an opaque user id and the endpoint are attached.
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}
    # Fraction of transactions sampled for performance tracing. 0 = errors only.
    traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  admin:
    # First-admin auto-seed. Both blank in dev → no-op. Set via env on a fresh
    # prod DB to create the initial ADMIN; ignored once any ADMIN exists.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  billing:
    # monobank acquiring. The merchant token is env only and blank in local dev —
    # then checkout runs in DEV-SIMULATION mode (grants PRO immediately, no HTTP
    # call), so the flow is testable without a merchant account.
    monobank-token: ${MONOBANK_TOKEN:}
    monobank-api-base: ${MONOBANK_API_BASE:https://api.monobank.ua}
    # Dev-simulation (grant PRO with no token) is allowed in dev; prod forces this
    # false (application-prod.yml) so a missing token can never hand out free PRO.
    allow-dev-simulation: ${BILLING_ALLOW_DEV_SIM:true}
    # Days before expiry to send the auto-renew warning email (T-N).
    renew-reminder-days: ${BILLING_RENEW_REMINDER_DAYS:3}
    # PRO price (UAH/month) and the granted period.
    pro-price: ${BILLING_PRO_PRICE:299}
    pro-days: ${BILLING_PRO_DAYS:30}
    # Half-year tariff (6 months, discounted): 1494 = 249/mo (vs 299 monthly).
    pro-half-year-price: ${BILLING_PRO_HALF_YEAR_PRICE:1494}
    # Year tariff (12 months, deepest discount): 2748 = 229/mo — saves 840 ₴ vs monthly.
    pro-year-price: ${BILLING_PRO_YEAR_PRICE:2748}
    # PRO days awarded to a referrer when their invited master first pays.
    referral-reward-days: ${BILLING_REFERRAL_REWARD_DAYS:30}
    # Days after expiry before the daily job downgrades PRO → FREE (late-renew window).
    grace-days: ${BILLING_GRACE_DAYS:3}
    # Length of the self-serve one-time PRO trial (opt-in, no card required).
    trial-days: ${BILLING_TRIAL_DAYS:5}
    # Where monobank redirects the payer back (PWA) and where it POSTs the result
    # (this backend — must be reachable from the internet: prod, or a tunnel in dev).
    return-url: ${BILLING_RETURN_URL:http://localhost:5173/billing/return}
    webhook-url: ${BILLING_WEBHOOK_URL:http://localhost:8080/api/billing/webhook}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
