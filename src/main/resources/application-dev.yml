spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # DevTools watches src/main/resources/static/** and reloads on edit;
  # disable HTTP caching of static files so the browser always picks up
  # the new version on the next request.
  web:
    resources:
      cache:
        period: 0
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

# `./gradlew bootRun` runs under this profile unless told otherwise (build.gradle.kts), so it covers
# local dev AND the Playwright e2e backend. A packaged jar never gets here by accident. The
# register/forgot IP limits are effectively lifted so repeated e2e runs never hit a false 429; prod
# runs under the `prod` profile and inherits the real base caps (5/hour/IP).
app:
  rate-limit:
    register:
      max-attempts: 100000
      window-minutes: 1
    forgot:
      max-attempts: 100000
      window-minutes: 1
  billing:
    allow-dev-simulation: ${BILLING_ALLOW_DEV_SIM:true}

logging:
  level:
    com.majstr.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
