error.import.unreadable=This doesn't look like a table. Use .xlsx, .csv, or rows pasted from Excel/Google Sheets
error.import.too-many-rows=Too many rows at once. Split the price list into batches of up to 500

# --- estimate import (LLM extraction) -----------------------------------------
error.import.unsupported=Unsupported file. Use Excel (.xlsx/.xls), .csv, or a photo (JPEG/PNG)
error.import.file-too-large=File is too large (up to 15 MB). Compress or split the PDF
error.import.too-many-pages=Too many pages at once — pick up to 10 sheets
error.ai.unavailable=Couldn't read the image. Try again or enter the items manually.

# --- object measurements (Заміри) ---------------------------------------------
error.measurement.invalid=Check the measurement dimensions — they can't be negative.
error.measurement.unit-mismatch=Can't mix different units in one line.

