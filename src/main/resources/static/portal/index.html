<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3a2519">
    <!-- Private, token-addressed estimate — must never be indexed. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- The share token is in the URL — never leak it via the Referer header. -->
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>Кошторис</title>
    <style>
        /* Majstr brand design system — warm oak-bark + bright amber, the same
           palette as the app and landing. Visual layer only; all classes/ids
           below are exactly what the page script renders, so behaviour is
           unchanged. */
        :root {
            --ink: #3a2519;        /* warm oak bark — dark: header, headings, primary text */
            --ink-2: #4a3122;      /* hover of the dark */
            --paper: #f7f1e7;      /* warm paper — page background */
            --paper-2: #ede2d1;    /* slightly darker paper */
            --line: #d9ccb5;       /* warm border line */
            --amber: #f5821f;      /* bright amber accent — main action, labels */
            --amber-deep: #e06c00; /* richer amber — hover */
            --muted: #705c47;      /* muted warm — secondary text (used inline by the script too) */
            --white: #ffffff;
            --success: #2f7a3f;    /* signed state */
            --danger: #b3402a;     /* error state (warm red) */
            --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 1px 2px rgba(58, 37, 25, 0.05), 0 6px 18px rgba(58, 37, 25, 0.04);
        }
        .card p { margin: 6px 0; color: var(--ink); }
        /* Contractor header — dark oak-bark band with light text. */
        .card.contractor {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--ink);
            border-color: var(--ink);
            color: var(--white);
        }
        .contractor img {
            max-height: 56px;
            max-width: 120px;
            /* White chip so any logo (incl. dark ones) stays visible on the dark band. */
            background: var(--white);
            padding: 6px 8px;
            border-radius: 10px;
        }
        .contractor .name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0;
            color: var(--white);
        }
        .contractor .phone {
            color: #e7d8c4;
            font-family: var(--mono);
            font-size: 0.92rem;
            margin: 4px 0 0;
        }
        /* Section labels ("ОБ'ЄКТ", "РОБОТИ", "МАТЕРІАЛИ", "УМОВИ") — small mono amber. */
        h2 {
            font-family: var(--mono);
            font-size: 0.72rem;
            margin: 0 0 12px;
            color: var(--amber);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        /* A section band inside the table: centred, as in the PDF. Left-aligned it sits under
           «Назва» and reads as one more line rather than as a divider between stages. */
        tr.section td {
            background: var(--paper-2);
            font-weight: 700;
            text-align: center;
            letter-spacing: .02em;
        }
        /* The whole band is a click target on the portal (V125 iteration): a tap on the section
           name folds/unfolds its rows. `cursor: pointer` on the whole cell tells the client the
           row is interactive; keyboard users get Enter/Space via the JS handler below. */
        tr.section[data-section-toggle] { cursor: pointer; }
        tr.section[data-section-toggle]:focus-visible td {
            outline: 2px solid var(--brand);
            outline-offset: -2px;
        }
        /* Chevron rotates open in the DEFAULT state and back closed when its own <tbody> carries
           `.collapsed`. Same visual cue the master's app uses, so a client who has seen the estimate
           on the phone recognises it here. */
        .chevron {
            display: inline-block;
            transform: rotate(90deg);
            transition: transform 120ms ease-out;
            color: var(--brand);
            font-weight: 900;
            /* Bigger than the surrounding «section» band text — master feedback 2026-09-04: the
               tiny character was hard to see and read as decoration rather than as a control. */
            font-size: 1.05rem;
            line-height: 1;
            width: 1em;
            text-align: center;
            vertical-align: middle;
        }
        tbody.collapsed .chevron { transform: rotate(0deg); }
        /* Fold: hide every row of a collapsed tbody EXCEPT the header (which is the toggle itself). */
        tbody.collapsed tr.section-body,
        tbody.collapsed tr.section-total { display: none; }
        /* «(3)» tells the client «here are still 3 lines, they are just folded», not «this stage has
           nothing». Rendered only in the collapsed state — else it's noise on an expanded header. */
        .section-count { color: var(--muted); font-weight: 600; display: none; }
        tbody.collapsed .section-count { display: inline; }
        /* Trade badge on category headers when the estimate spans ≥ 2 trades (V125). Colours are a
           subset of the master's PWA palette — soft background + saturated text, one hue per trade,
           adjacent enum values never share. Change this file AND components/TradeBadge.tsx together
           or the two views drift. */
        .trade-badge {
            display: inline-block;
            padding: 1px 8px;
            margin-left: 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .02em;
            vertical-align: middle;
        }
        .trade-ELECTRICAL { background: #fef3c7; color: #92400e; }
        .trade-PLUMBING   { background: #e0f2fe; color: #075985; }
        .trade-TILING     { background: #ffe4e6; color: #9f1239; }
        .trade-BUILDER    { background: #e7e5e4; color: #292524; }
        .trade-PAINTER    { background: #ede9fe; color: #5b21b6; }
        .trade-DRYWALL    { background: #d1fae5; color: #065f46; }
        .trade-FLOORING   { background: #ffedd5; color: #9a3412; }
        .trade-DEMOLITION { background: #fee2e2; color: #991b1b; }
        .trade-METAL      { background: #e2e8f0; color: #1e293b; }
        .trade-GENERAL    { background: #dbeafe; color: #1e40af; }
        .trade-OTHER      { background: #e5e5e5; color: #404040; }
        /* What this stage costs — the figure a client compares, so it carries the same weight as
           the number beside it rather than looking like a caption. */
        tr.section-total td {
            font-weight: 700;
            border-bottom: 1px solid var(--line);
        }
        tr.section-total td:first-child { text-align: right; }
        /* Stable column widths so headers and numbers line up regardless of the longest line.
           The numeric columns are fixed and the first (Назва) takes the remainder — where the NAME
           WRAPS onto as many lines as it needs. It used to ellipsize to one line, which on a phone
           cut «Підготовка ГКЛ під фарбування…» off exactly where the meaning is. Currency ("грн")
           is shown once in the header, not per row, so the monospace figures fit even on narrow
           phones. */
        th:nth-child(2), td:nth-child(2) { width: 10%; }
        th:nth-child(3), td:nth-child(3) { width: 13%; }
        th:nth-child(4), td:nth-child(4) { width: 18%; }
        th:nth-child(5), td:nth-child(5) { width: 20%; }
        td:first-child {
            white-space: normal;
            overflow-wrap: anywhere;
        }
        thead th {
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-weight: 600;
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
        }
        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            font-size: 0.95rem;
            color: var(--ink);
        }
        tbody tr:last-child td { border-bottom: none; }
        th.center, td.center { text-align: center; }
        /* Numbers (qty, price, sum) in monospace with tabular figures so columns align. */
        th.num, td.num {
            text-align: right;
            white-space: nowrap;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }
        .totals {
            margin-top: 4px;
            display: grid;
            gap: 8px;
        }
        .totals .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 1rem;
            color: var(--muted);
        }
        .totals .row span:last-child {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }
        /* "РАЗОМ" — emphasized with a strong top line. */
        .totals .grand {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--ink);
            border-top: 2px solid var(--ink);
            padding-top: 12px;
            margin-top: 6px;
        }
        .totals .grand span:last-child { color: var(--ink); font-weight: 800; }
        /* «Надбавка/Знижка» recap — the same wording the app's black summary panel shows, so a
           client who's seen the app doesn't see different numbers on the portal. Smaller than the
           Роботи/Матеріали/Разом line below it (.summary-figures) — a supporting note, not a peer
           figure (2026-08-14: briefly swapped larger-than-figures, then corrected back on explicit
           feedback — the figures need to read clearly at a glance, the recap is secondary to them).
           Bare `.adjust` (not `.totals .adjust`) — `adjustNote()` emits a plain `<div class="adjust">`
           with no `.totals` ancestor now that renderSection's duplicate totals block is gone; the
           old scoped selector silently stopped matching Зведення's own copy the moment that block
           was removed, so this line had been rendering at the unstyled browser default (caught
           2026-08-14 by inspecting the live page, not by reading the CSS in isolation). */
        .adjust {
            font-size: 0.72rem;
            color: var(--muted);
            padding-top: 2px;
        }
        /* Зведення — one compact line per shown estimate, top of page. */
        .summary-list { display: grid; gap: 12px; }
        .summary-row + .summary-row { border-top: 1px solid var(--line); padding-top: 12px; }
        .summary-figures {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 0.82rem;
            color: var(--muted);
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }
        .summary-figures .summary-total { color: var(--ink); font-weight: 700; }
        /* Object-level payments card — compact list: one line per payment. Received (fully paid)
           stages + unplanned receipts collapse into a single tappable history row; upcoming
           (partial/planned/overdue) stay one line each, dot + name+date on the left, sum right. */
        .payments-list { display: grid; margin-top: 4px; }
        .payment-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 7px 0;
            border-bottom: 1px solid var(--line);
        }
        .payment-row:last-child { border-bottom: none; }
        /* A few px nudge so the dot itself doesn't sit flush against the card's own edge — via
           `transform`, not margin: a flex item's margin still pushes every sibling after it (the
           label/amount would have shifted right too, which isn't wanted here — only the dot should
           move). `transform` shifts the rendered dot without touching layout, so the text stays
           exactly where it already was. Applied once on the shared `.payment-dot` class so every
           row type (collapsed group, expanded items, upcoming) keeps its dot aligned with the rest. */
        .payment-dot {
            flex-shrink: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--white);
            transform: translateX(4px);
        }
        .payment-dot.received { background: var(--success); border-color: var(--success); }
        .payment-dot.partial { background: var(--amber); border-color: var(--amber); }
        .payment-dot.overdue { background: var(--danger); border-color: var(--danger); }
        .payment-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.88rem;
            color: var(--ink);
        }
        .payment-label .payment-date { color: var(--muted); font-weight: 400; }
        .payment-amount {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            text-align: right;
            flex-shrink: 0;
            font-size: 0.88rem;
            color: var(--ink);
            font-weight: 700;
        }
        /* The collapsed "✓ Отримано · N платежів" row — a real button, tap expands it in place. */
        .payment-collapsed {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 44px;
            /* Right padding so the chevron gets breathing room instead of sitting flush against
               the card edge (looked like it was about to clip off — reported 2026-08-14; nudged
               further left the same day, still felt tight against the edge). */
            padding: 8px 10px 8px 0;
            border: none;
            border-bottom: 1px solid var(--line);
            background: none;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--success);
            text-align: left;
            cursor: pointer;
        }
        .payment-collapsed:last-child { border-bottom: none; }
        .payment-collapsed .chev { margin-left: auto; flex-shrink: 0; color: var(--muted); font-weight: 400; }
        /* >5 payments: one highlighted "next" card instead of the full list. */
        .payment-next {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        .payment-next .payment-label { font-size: 0.92rem; }
        .payment-next-label {
            margin: 10px 0 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
        }
        .payment-expand-toggle {
            display: block;
            width: 100%;
            min-height: 44px;
            margin-top: 6px;
            padding: 8px 0;
            border: none;
            background: none;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--amber-deep);
            text-align: center;
            cursor: pointer;
        }
        .payment-all-done {
            padding: 10px 0 2px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--success);
        }
        .paybar { height: 10px; border-radius: 6px; background: var(--paper-2); overflow: hidden; margin: 8px 0 4px; }
        /* Twin of the app's ProgressStrip (majstr-pwa/src/components/ProgressStrip.tsx) — the same
           bar, in plain CSS because this page never loads the PWA bundle. Colour is a POSITION:
           the amber→green gradient spans the whole TRACK (that is what the inline background-size
           stretches it to) and the fill is a window onto it, so a bar at 30 % shows only amber and
           one at 90 % shows a green tail. Change the rule here and in ProgressStrip together. */
        .paybar-fill { height: 100%; background-image: linear-gradient(to right, var(--amber), var(--success)); }
        .paybar-fill.complete { background-image: none; background-color: var(--success); }
        .paybar-label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        /* One curated (i)-explanation next to the payments header — mirrors the app's InfoPopover
           component (tap → panel, close on outside-tap/Esc/✕/scroll), reimplemented in plain JS
           since the portal has no build step to share a React component with. Rebuilt from
           scratch (2026-08-13): the earlier version had no scroll handling — position:fixed meant
           the panel stayed pinned to its opening screen coordinates while the trigger scrolled
           away underneath it, reading as visually "broken". This one just closes on scroll instead
           of re-tracking the trigger — simpler and can't drift stale. */
        .info-trigger {
            position: relative;
            display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
            width: 18px; height: 18px; border-radius: 50%;
            background: color-mix(in srgb, var(--amber) 18%, var(--white));
            color: var(--amber-deep); font-size: 0.7rem; font-weight: 700; line-height: 1;
            border: none; padding: 0; cursor: pointer;
        }
        /* An 18 px dot sits beside a heading, so it cannot simply be made 44 px — the hit area is
           grown instead, invisibly, past the drawn circle. Same trick for the popover's ✕. */
        .info-trigger::after, .info-panel-close::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 44px; height: 44px; transform: translate(-50%, -50%);
        }
        .info-panel {
            position: fixed; z-index: 61; max-width: min(20rem, calc(100vw - 2rem));
            background: var(--white); border-radius: 14px; padding: 12px 30px 12px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18); font-size: 0.85rem; line-height: 1.4; color: var(--ink); white-space: pre-line;
        }
        .info-panel-close {
            position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
            border: none; background: transparent; color: var(--muted); font-size: 0.8rem; padding: 0; cursor: pointer;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        /*
         * Touch reliability. The client opens this page on a phone, and «Підписати» is the one
         * action it exists for — a tap that does not register is the whole feature failing.
         *
         * Two browser behaviours were eating those taps, both of which look like a dead button:
         * a press landing on the button's TEXT starts a native selection (and on a longer hold the
         * callout menu), after which the `click` is never dispatched; and double-tap-to-zoom makes
         * the browser wait for a possible second tap, so an immediate retry reads as a zoom rather
         * than two clicks. Hence `user-select: none` + `touch-action: manipulation` on every
         * control here. The PWA carries the same block in `src/styles/index.css`.
         */
        /* A text input is left out on purpose: double-tap there selects a word, and that IS the
           gesture `manipulation` suppresses. Only things that are pressed are listed. */
        button, a.btn, [role="button"], summary, select, label,
        input[type="checkbox"], input[type="radio"], input[type="submit"] {
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }
        button, a.btn, [role="button"], summary, tr.section[data-section-toggle] {
            -webkit-user-select: none;
            user-select: none;
        }
        button, a.btn {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 600;
            padding: 13px 20px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--white);
            color: var(--ink);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.05s;
        }
        /* A touch device has no hover but fakes one: the last-tapped control keeps the hover look
           until something else is tapped, which is exactly the signal the client reads to decide
           whether the tap landed. :active below is driven by a real press. */
        @media (hover: hover) {
            button:hover, a.btn:hover { background: var(--paper-2); }
        }
        button:active, a.btn:active { transform: translateY(1px); opacity: 0.75; }
        /* Primary action ("Підписати кошторис") — bright amber, dark text, prominent. */
        button.primary, a.btn.primary {
            background: var(--amber);
            border-color: var(--amber);
            color: var(--ink);
            font-weight: 800;
            box-shadow: 0 2px 10px rgba(245, 130, 31, 0.25);
        }
        @media (hover: hover) {
            button.primary:hover, a.btn.primary:hover {
                background: var(--amber-deep);
                border-color: var(--amber-deep);
            }
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
        .signed {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--success);
            font-weight: 700;
            background: rgba(47, 122, 63, 0.08);
            border: 1px solid rgba(47, 122, 63, 0.25);
            padding: 8px 12px;
            border-radius: 10px;
            margin: 0 0 12px;
        }
        .error {
            color: var(--danger);
            padding: 8px 0;
            text-align: center;
            font-weight: 600;
            font-size: 1.02rem;
        }
        /* Loading text (the script sets #root to a bare <p> while fetching). */
        #root > p { text-align: center; color: var(--muted); padding: 40px 0; }
        /* Shared object photos gallery. */
        .photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .photo { margin: 0; }
        .photo img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--line, #e6dccb);
            display: block;
        }
        .photo figcaption {
            margin-top: 4px;
            font-size: 0.82rem;
            color: var(--muted);
        }
        dialog {
            border: none;
            border-radius: 16px;
            padding: 22px;
            max-width: 440px;
            width: calc(100% - 32px);
            background: var(--white);
            color: var(--ink);
            box-shadow: 0 12px 40px rgba(58, 37, 25, 0.25);
        }
        dialog::backdrop { background: rgba(58, 37, 25, 0.45); }
        dialog h3 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--ink);
        }
        dialog label {
            display: block;
            margin: 12px 0 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
        }
        dialog input, dialog textarea {
            width: 100%;
            font-family: var(--sans);
            font-size: 1rem;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--paper);
            color: var(--ink);
        }
        dialog input:focus, dialog textarea:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(245, 130, 31, 0.18);
            background: var(--white);
        }
        dialog textarea { min-height: 120px; resize: vertical; }
        dialog .dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }
        /* One portal section per estimate — a strong divider so «Економ» and
           «Преміум» read as separate documents on one page. */
        .estimate-section { margin-top: 30px; }
        .estimate-section:first-of-type { margin-top: 0; }
        /* `p.estimate-title`, not `.estimate-title` — this renders as a <p>, and inside a `.card`
           (the Зведення summary rows) the earlier `.card p { color: var(--ink) }` rule has equal
           class-specificity plus its own type selector, so it otherwise wins and silently turns
           this band's white text back to ink-on-ink (invisible — caught 2026-08-14, reported as
           "estimate names not visible"). The type selector here ties that specificity; declared
           later in the file, so it wins the tie-break instead of needing `!important`. */
        p.estimate-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0 0 10px;
            padding: 10px 14px;
            background: var(--ink);
            color: var(--white);
            border-radius: 12px;
        }
        @media (max-width: 480px) {
            .container { padding: 14px 12px 32px; }
            .card { padding: 16px; }
            tbody td, thead th { padding: 7px 4px; font-size: 0.86rem; }
            /* Give the price/sum columns the room and shrink the ellipsized
               name so the monospace figures never collide on a phone. The
               unit code gets a slightly smaller font so "компл" fits one line. */
            th:nth-child(2), td:nth-child(2) { width: 12%; }
            th:nth-child(3), td:nth-child(3) { width: 10%; }
            th:nth-child(4), td:nth-child(4) { width: 26%; }
            th:nth-child(5), td:nth-child(5) { width: 27%; }
            th.num, td.num { font-size: 0.76rem; }
            td.center, th.center { font-size: 0.72rem; }
            .actions button, .actions a.btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="root"><p>Завантаження…</p></div>
</div>

<footer style="max-width:760px;margin:8px auto 28px;padding:0 20px;font-size:12px;line-height:1.5;color:#9a8f80;text-align:center">
    Цей кошторис і ваші контактні дані надав вам майстер для погодження робіт.
    Технічний сервіс — Majstr. Питання щодо ваших даних: до вашого майстра або на
    <a href="mailto:support@majstr.pro" style="color:inherit;text-decoration:underline">support@majstr.pro</a>.
</footer>

<dialog id="signDialog">
    <h3 style="margin-top:0">Підписати кошторис</h3>
    <label for="signName">Ваше ім'я</label>
    <input id="signName" type="text" maxlength="255" required>
    <label for="signPhone">Телефон</label>
    <input id="signPhone" type="tel" maxlength="50" required>
    <div class="dialog-actions">
        <button type="button" data-close="signDialog">Скасувати</button>
        <button type="button" id="signSubmit" class="primary">Підписати</button>
    </div>
</dialog>

<dialog id="questionDialog">
    <h3 style="margin-top:0">Задати питання</h3>
    <label for="qName">Ваше ім'я (необов'язково)</label>
    <input id="qName" type="text" maxlength="255">
    <label for="qPhone">Телефон (необов'язково)</label>
    <input id="qPhone" type="tel" maxlength="50">
    <label for="qMessage">Повідомлення</label>
    <textarea id="qMessage" maxlength="2000" required></textarea>
    <div class="dialog-actions">
        <button type="button" data-close="questionDialog">Скасувати</button>
        <button type="button" id="qSubmit" class="primary">Надіслати</button>
    </div>
</dialog>

<script>
(function () {
    // Three token families: ?p= is the SIGNATURE portal (any-status estimates, a section per
    // shared one, for signing); ?e= is the ECONOMY portal (SIGNED acts only, read-only, plus an
    // optional payments card); ?t= is the legacy per-estimate link (URLs already sent to clients
    // keep working). One render path — the legacy response is adapted into the portal shape below.
    const params = new URLSearchParams(window.location.search);
    const portalToken = params.get('p');
    const economyToken = params.get('e');
    const actToken = params.get('a');
    const legacyToken = params.get('t');
    const root = document.getElementById('root');
    // ECONOMY acts are already SIGNED and immutable — no sign button/dialog for this mode.
    const isEconomy = Boolean(economyToken);

    if (!portalToken && !economyToken && !actToken && !legacyToken) {
        root.innerHTML = '<div class="error">Невірне посилання</div>';
        return;
    }

    const apiBase = actToken
        ? '/api/public/act/' + encodeURIComponent(actToken)
        : economyToken
        ? '/api/public/economy/' + encodeURIComponent(economyToken)
        : portalToken
        ? '/api/public/portal/' + encodeURIComponent(portalToken)
        : '/api/public/estimates/' + encodeURIComponent(legacyToken);

    // Where a section's sign / question / pdf endpoints live. Both portal kinds address them
    // per estimate; the legacy link has exactly one estimate.
    function sectionApi(estimateId) {
        return (portalToken || economyToken)
            ? apiBase + '/estimates/' + encodeURIComponent(estimateId)
            : apiBase;
    }

    const moneyFormat = new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const percentFormat = new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 2 });
    const dateFormat = new Intl.DateTimeFormat('uk-UA', { dateStyle: 'medium' });
    // Same shape as the app's own `estimateName()` fallback ("Кошторис від 18 листопада") — day +
    // full month name, no year. An unnamed estimate must read identically everywhere it appears
    // (Кошторис-tab list, Економіка panel, this page) rather than a different placeholder per spot.
    const nameDateFormat = new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'long' });
    // Payment dates read tighter — day + ABBREVIATED month, still no year ("11 серп."). A payment
    // row has far less horizontal room than an estimate name band, so the full month name would
    // force wrapping or truncation on a narrow phone.
    const shortDateFormat = new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'short' });

    function defaultEstimateName(est) {
        return 'Кошторис від ' + nameDateFormat.format(new Date(est.createdAt));
    }

    // Every Unit the API can return. A missing entry falls through to the raw enum code, so a
    // client would read «FLOOR» on his estimate — the same way PERCENT was once shown.
    const UNIT_LABEL = {
        M2: 'м²', M: 'м', LINEAR_METER: 'м.п.', PIECE: 'шт', KG: 'кг', HOUR: 'год', SET: 'компл',
        M3: 'м³', T: 'т', POINT: 'точка', PERCENT: '%', KM: 'км', DAY: 'день', FLOOR: 'поверх',
        LITRE: 'л'
    };

    function money(value) {
        return moneyFormat.format(Number(value)) + ' грн';
    }

    // Currency is shown once in the column header, so per-row cells carry the
    // bare figure — keeps the monospace numbers from overflowing narrow phones.
    function amount(value) {
        return moneyFormat.format(Number(value));
    }

    function unit(code) {
        return UNIT_LABEL[code] || code;
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Group into the sections the master arranged: a section IS the lines sharing a category, and
    // its place follows the first of them, which is what sortOrder already encodes. Same rule as
    // the PDF, so the page a client reads and the document they keep never disagree.
    //
    // An estimate whose lines carry no category renders exactly as it did before sections existed:
    // no headings, no subtotals. A master who does not file their lines should not be shown a
    // «Без категорії» band over everything, nor a subtotal that just repeats the table's own total.
    function toSections(items) {
        const sections = [];
        const byCategory = new Map();
        [...items].sort((a, b) => a.sortOrder - b.sortOrder).forEach(item => {
            const category = (item.category || '').trim();
            let section = byCategory.get(category);
            if (!section) {
                section = { category, items: [] };
                byCategory.set(category, section);
                sections.push(section);
            }
            section.items.push(item);
        });
        return sections;
    }

    // Ukrainian label for a `Trade` enum value (V125). Matches the PWA's `trades.*` i18n block —
    // change one, change the other. The portal is a standalone page with no bundle: this is inline.
    const TRADE_LABELS = {
        ELECTRICAL: 'Електрика',
        PLUMBING:   'Сантехніка',
        TILING:     'Плитка',
        BUILDER:    'Будівельник',
        PAINTER:    'Малярні роботи',
        DRYWALL:    'Гіпсокартон',
        FLOORING:   'Підлоги',
        DEMOLITION: 'Демонтаж',
        METAL:      'Металоконструкції',
        GENERAL:    'Загальні роботи',
        OTHER:      'Інше',
    };

    // True iff the estimate carries ≥ 2 distinct non-null trades — same rule as the master's board
    // (V125 iteration). A NULL row does NOT count as a "trade": NULL is «we don't know», not a
    // real bucket; a mixed estimate with typed rows must not light up its own badge.
    function estimateHasMultipleTrades(items) {
        const seen = new Set();
        for (const it of items) {
            if (it.trade) seen.add(it.trade);
            if (seen.size >= 2) return true;
        }
        return false;
    }

    // Client-side fold memory, per estimate. Mirrors `useCollapsedCategories` on the master's app,
    // stored on THIS origin (portal) so it never leaks into the master's own state and vice versa.
    // Empty set = everything expanded (the default the master asked for).
    function collapsedKey(estimateId) { return 'portal:estimate:' + estimateId + ':collapsed'; }
    function readCollapsed(estimateId) {
        try {
            const raw = localStorage.getItem(collapsedKey(estimateId));
            if (!raw) return new Set();
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? new Set(arr.filter(x => typeof x === 'string')) : new Set();
        } catch { return new Set(); }
    }
    function writeCollapsed(estimateId, set) {
        try {
            if (set.size === 0) localStorage.removeItem(collapsedKey(estimateId));
            else localStorage.setItem(collapsedKey(estimateId), JSON.stringify([...set]));
        } catch { /* private mode / quota — the client just loses persistence, not the page */ }
    }

    function renderItems(items, kind, estimateId, showTradeBadges) {
        const subset = items.filter(i => i.type === kind);
        if (!subset.length) return '';
        // Legacy `?t=` links (single-estimate portal) come through `adaptLegacy` with `est.id = null`.
        // Fold state MUST NOT leak between different `?t=` tokens: two different estimates that
        // both happen to have a «Каркас» category would share it. `location.search` is the token
        // for these links; on the multi-estimate route it's ignored (estimateId is a real UUID).
        const foldKey = estimateId || ('legacy:' + (typeof location !== 'undefined' ? location.search : ''));
        const title = kind === 'WORK' ? 'Роботи' : 'Матеріали';
        const sections = toSections(subset);
        const sectioned = sections.length > 1 || sections[0].category !== '';
        const collapsedSet = readCollapsed(foldKey);
        // Each section becomes its OWN <tbody>, so a `.collapsed` class on that tbody hides its
        // item and footer rows without touching sibling sections — a plain `~ [data-section-body]`
        // selector would leak across sections whose category names ever match. Also lets the header
        // stay in the DOM at all times, so a fold-toggle is one class flip and never a DOM insert.
        const bodies = sections.map(section => {
            const isCollapsed = collapsedSet.has(section.category);
            // Dominant trade of a section = trade of its first labelled item. Same rule as sortOrder:
            // a section is the run of lines sharing a category, ordered by the first of them.
            const trade = showTradeBadges
                ? (section.items.find(i => i.trade) || {}).trade || null
                : null;
            const badge = trade
                ? `<span class="trade-badge trade-${trade}">${escapeHtml(TRADE_LABELS[trade] || trade)}</span>`
                : '';
            const head = sectioned ? `
            <tr class="section" data-section-toggle role="button" tabindex="0"
                aria-expanded="${isCollapsed ? 'false' : 'true'}">
                <td colspan="5">
                    <span class="chevron" aria-hidden="true">▸</span>
                    ${escapeHtml(section.category || 'Без категорії')}
                    <span class="section-count" data-section-count>(${section.items.length})</span>
                    ${badge}
                </td>
            </tr>` : '';
            const bodyRows = section.items.map(i => `
            <tr class="section-body">
                <td>${escapeHtml(i.name)}</td>
                <td class="center">${escapeHtml(unit(i.unit))}</td>
                <td class="num">${escapeHtml(i.quantity)}</td>
                <td class="num">${amount(i.unitPrice)}</td>
                <td class="num">${amount(i.lineTotal)}</td>
            </tr>`).join('');
            const sum = section.items.reduce((acc, i) => acc + Number(i.lineTotal || 0), 0);
            const foot = (sectioned && section.items.length >= 2) ? `
            <tr class="section-total">
                <td colspan="4">Разом по розділу</td>
                <td class="num">${amount(sum)}</td>
            </tr>` : '';
            return `<tbody data-section="${escapeHtml(section.category)}" data-estimate-id="${escapeHtml(foldKey)}"${isCollapsed ? ' class="collapsed"' : ''}>${head}${bodyRows}${foot}</tbody>`;
        }).join('');
        return `
            <section class="card">
                <h2>${title}</h2>
                <table>
                    <thead><tr>
                        <th>Назва</th>
                        <th class="center">Од.</th>
                        <th class="num">К-сть</th>
                        <th class="num">Ціна, ₴</th>
                        <th class="num">Сума, ₴</th>
                    </tr></thead>
                    ${bodies}
                </table>
            </section>
        `;
    }

    // Photos the master chose to share (progress on the object). The file is streamed
    // through the same share token — no public/guessable URL.
    function renderPhotos(photos) {
        if (!photos || !photos.length) return '';
        const tiles = photos.map(p => `
            <figure class="photo">
                <a href="${apiBase}/photos/${encodeURIComponent(p.id)}/file" target="_blank" rel="noopener">
                    <img loading="lazy" alt="${escapeHtml(p.caption || 'Фото об’єкта')}"
                         src="${apiBase}/photos/${encodeURIComponent(p.id)}/file">
                </a>
                ${p.caption ? `<figcaption>${escapeHtml(p.caption)}</figcaption>` : ''}
            </figure>
        `).join('');
        return `<section class="card"><h2>Фото об’єкта</h2><div class="photos">${tiles}</div></section>`;
    }

    // Same wording the app's black summary panel uses (AdjustNote) — never recomputed here,
    // just the numbers the server already worked out. The % (when the server could name one —
    // TypeBreakdown's own "exactly one contributing line" rule, mirrored server-side) is shown
    // right after the label, same as the black panel; several lines with no single % just show
    // the sum, same as before — never a fabricated blended number.
    function adjustNote(markup, discount, markupPercent, discountPercent) {
        const m = Number(markup || 0);
        const d = Number(discount || 0);
        if (m <= 0 && d >= 0) return '';
        const parts = [];
        if (m > 0) {
            parts.push('Надбавка' + (markupPercent != null ? ' ' + percentFormat.format(Math.abs(Number(markupPercent))) + '%' : ''));
            parts.push(money(m));
        }
        if (d < 0) {
            parts.push('Знижка' + (discountPercent != null ? ' ' + percentFormat.format(Math.abs(Number(discountPercent))) + '%' : ''));
            parts.push(money(-d));
        }
        return `<div class="adjust">${parts.join(' · ')}</div>`;
    }

    // A TOTAL-kind (or frozen-consolidated) PERCENT line is already baked into its own type's
    // subtotal (works/materials are summed by raw item type, percent line included) — so showing
    // that subtotal next to «Разом» made the two look identical with no visible sign a discount
    // ever applied. Backs the adjustment back OUT to get the pre-adjustment "base" figure instead,
    // same math as the app's own TypeBreakdown (base + adjustment reconciles to the subtotal the
    // total is built from). A POSITION/MANUAL percent line needs no such treatment — it already
    // reads as an ordinary line with nothing to "explain away".
    function typeBase(items, type, subtotal) {
        const totalLines = (items || []).filter(i =>
            i.type === type && i.unit === 'PERCENT' && (i.percentBaseKind || 'MANUAL') === 'TOTAL');
        const adjust = totalLines.reduce((s, i) => s + Number(i.lineTotal || 0), 0);
        const frozenLines = (items || []).filter(i => i.type === type && i.unit === 'PERCENT' && i.baseOriginLabel);
        const frozenMarkup = frozenLines.filter(i => Number(i.lineTotal) > 0).reduce((s, i) => s + Number(i.lineTotal), 0);
        const frozenDiscount = frozenLines.filter(i => Number(i.lineTotal) < 0).reduce((s, i) => s + Number(i.lineTotal), 0);
        return Math.round((Number(subtotal || 0) - adjust - frozenMarkup - frozenDiscount) * 100) / 100;
    }

    // One line per shown estimate (name · Роботи · Матеріали · Разом, + a small discount/markup
    // recap) plus a grand total — a quick top-of-page snapshot before the client scrolls into the
    // full per-estimate detail. Built purely from fields the estimate sections already carry.
    // Always shown, even for exactly one estimate (reverted 2026-08-14, per explicit instruction —
    // this panel is the ONE place the estimate name and its totals live now; the redundant totals
    // block that used to sit further down each per-estimate section is gone, see renderSection).
    function renderSummary(estimates) {
        if (!estimates || estimates.length === 0) return '';
        const rows = estimates.map((e) => {
            const title = e.name ? e.name : defaultEstimateName(e);
            return `
                <div class="summary-row">
                    <p class="estimate-title">${escapeHtml(title)}</p>
                    <div class="summary-figures">
                        <span>Роботи: ${amount(typeBase(e.items, 'WORK', e.worksSubtotal))}</span>
                        <span>Матеріали: ${amount(typeBase(e.items, 'MATERIAL', e.materialsSubtotal))}</span>
                        <span class="summary-total">Разом: ${amount(e.total)}</span>
                    </div>
                    ${adjustNote(e.markupAmount, e.discountAmount, e.markupPercent, e.discountPercent)}
                </div>`;
        }).join('');
        const grand = estimates.reduce((acc, e) => acc + Number(e.total || 0), 0);
        return `
            <section class="card">
                <h2>Зведення</h2>
                <div class="summary-list">${rows}</div>
                <div class="totals" style="margin-top:10px">
                    <div class="row grand"><span>Разом:</span><span>${money(grand)}</span></div>
                </div>
            </section>
        `;
    }

    const PAYMENT_DOT_CLASS = { RECEIVED: 'received', PARTIAL: 'partial', OVERDUE: 'overdue', PLANNED: '' };

    // Session-only: the "✓ Отримано · N платежів" row starts collapsed on every load — it's the
    // rarely-interesting half of the list (money already in). The >5-payment "show everything"
    // toggle below is the one worth remembering across visits, via localStorage.
    let receivedExpanded = false;
    let lastPaymentsCard = null;

    // Per-link, not per-device-global — a master's other objects must not inherit one client's
    // "I expanded the full list" choice, and a private/incognito localStorage throw must not break
    // the page (falls back to always-collapsed).
    const expandStorageKey = 'majstr-portal-payments-expanded:' + (economyToken || portalToken || actToken || legacyToken || '');
    function isAllExpanded() {
        try { return localStorage.getItem(expandStorageKey) === '1'; } catch (e) { return false; }
    }
    function setAllExpanded(v) {
        try { localStorage.setItem(expandStorageKey, v ? '1' : '0'); } catch (e) { /* ignore */ }
    }

    // Not a debt reminder — the condition for the NEXT stage of work, never "ви винні". Only used
    // for upcoming (not-yet-fully-received) rows — a received row's own date carries no condition.
    function upcomingCondition(row) {
        if (!row.dueDate && !row.nextStage) return '';
        const date = row.dueDate ? shortDateFormat.format(new Date(row.dueDate)) : null;
        if (date && row.nextStage) return `до ${date} — почати ${escapeHtml(row.nextStage)}`;
        if (date) return `до ${date}`;
        return `щоб почати «${escapeHtml(row.nextStage)}»`;
    }

    function paymentsWord(n) {
        const mod10 = n % 10, mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return 'платіж';
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'платежі';
        return 'платежів';
    }

    // Splits the raw card into what the compact view actually needs: fully-RECEIVED stages plus
    // every unplanned receipt (both just "money that already landed", so they merge into one
    // group) vs. still-open stages (PARTIAL/PLANNED/OVERDUE), sorted by their due-date condition.
    function groupPayments(card) {
        const received = [];
        const upcoming = [];
        (card.payments || []).forEach((p) => {
            if (p.status === 'RECEIVED') {
                received.push({ label: p.purpose, amount: p.amount, date: p.lastReceivedAt });
            } else {
                upcoming.push(p);
            }
        });
        (card.unplannedReceipts || []).forEach((r) => {
            received.push({ label: r.label, amount: r.amount, date: r.receivedAt });
        });
        received.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        upcoming.sort((a, b) => {
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate < b.dueDate ? -1 : 1;
        });
        return { received, upcoming };
    }

    function renderReceivedItemRow(item) {
        return `
            <div class="payment-row">
                <span class="payment-dot received"></span>
                <div class="payment-label">${escapeHtml(item.label)}${item.date ? ` <span class="payment-date">· ${shortDateFormat.format(new Date(item.date))}</span>` : ''}</div>
                <div class="payment-amount">${amount(item.amount)}</div>
            </div>
        `;
    }

    // Collapsed by default (one row, tap to expand in place) — the individual receipts are
    // history, not something a client needs to scan on every visit.
    function renderReceivedSection(received, expanded) {
        if (!received.length) return '';
        const header = `
            <button type="button" class="payment-collapsed" data-toggle-received="1">
                <span class="payment-dot received"></span>
                ✓ Отримано · ${received.length} ${paymentsWord(received.length)}
                <span class="chev">${expanded ? '︿' : '⌄'}</span>
            </button>
        `;
        return expanded ? header + received.map(renderReceivedItemRow).join('') : header;
    }

    function upcomingAmountText(row) {
        return row.received != null && Number(row.received) > 0
            ? `${amount(row.received)}/${amount(row.amount)}`
            : money(row.amount);
    }

    function renderUpcomingRow(row) {
        const dotClass = PAYMENT_DOT_CLASS[row.status] || '';
        const cond = upcomingCondition(row);
        return `
            <div class="payment-row">
                <span class="payment-dot ${dotClass}"></span>
                <div class="payment-label">${escapeHtml(row.purpose)}${cond ? ` <span class="payment-date">· ${cond}</span>` : ''}</div>
                <div class="payment-amount">${upcomingAmountText(row)}</div>
            </div>
        `;
    }

    // >5 payments: instead of the full list, one highlighted card for the nearest unpaid stage
    // plus an "Усі платежі (N)" toggle that reveals the same 2+1 list the ≤5 case shows inline.
    function renderNextCard(row) {
        const dotClass = PAYMENT_DOT_CLASS[row.status] || '';
        const cond = upcomingCondition(row);
        return `
            <p class="payment-next-label">Наступний платіж</p>
            <div class="payment-next">
                <span class="payment-dot ${dotClass}"></span>
                <div class="payment-label">${escapeHtml(row.purpose)}${cond ? ` <span class="payment-date">· ${cond}</span>` : ''}</div>
                <div class="payment-amount">${upcomingAmountText(row)}</div>
            </div>
        `;
    }

    // Compact mobile card: a thin progress bar + one-line header ("Отримано X з Y ₴ · Z%") with
    // its own (i) explainer, then either a short "2+1" list (≤5 payments: one collapsed received
    // row + one line per upcoming stage), an "Усе сплачено ✓" terminal state, or — past 5 — a
    // single "next payment" card plus an expand toggle for the full list. No charting library.
    function renderPaymentsBody(card) {
        const total = Number(card.contractedTotal || 0);
        const received = Number(card.received || 0);
        // Uncapped for the LABEL: an overpayment is real money and must not read as «100 %».
        const pct = total > 0 ? Math.round((received / total) * 100) : 0;
        const barWidth = Math.max(0, Math.min(100, pct));
        const groups = groupPayments(card);
        const count = groups.received.length + groups.upcoming.length;

        let body;
        if (count === 0) {
            body = '';
        } else if (groups.upcoming.length === 0) {
            // "Усе сплачено" is a headline, never a replacement for the breakdown — a receipt
            // survives its plan stage being deleted (kept as unplanned, by design) and one logged
            // before an estimate had a contracted total to compare against is real money too. Hiding
            // the list here read as "де ці гроші взялись?" the moment contractedTotal was 0 or
            // otherwise didn't obviously explain the received figure (reported 2026-08-14).
            body = `<p class="payment-all-done">Усе сплачено ✓</p>
                <div class="payments-list">${renderReceivedSection(groups.received, receivedExpanded)}</div>`;
        } else if (count <= 5) {
            body = `<div class="payments-list">
                ${renderReceivedSection(groups.received, receivedExpanded)}
                ${groups.upcoming.map(renderUpcomingRow).join('')}
            </div>`;
        } else if (!isAllExpanded()) {
            body = `
                ${renderNextCard(groups.upcoming[0])}
                <button type="button" class="payment-expand-toggle" data-expand-payments="1">Усі платежі (${count}) ⌄</button>
            `;
        } else {
            body = `<div class="payments-list">
                ${renderReceivedSection(groups.received, receivedExpanded)}
                ${groups.upcoming.map(renderUpcomingRow).join('')}
            </div>
            <button type="button" class="payment-expand-toggle" data-expand-payments="0">Згорнути ︿</button>`;
        }

        return `
            <p class="paybar-label">
                Отримано ${amount(received)} з ${amount(total)} ₴ · ${pct}%
                <button type="button" class="info-trigger" data-info="payments" aria-label="Пояснення">i</button>
            </p>
            <div class="paybar">
                <div class="paybar-fill${pct >= 100 ? ' complete' : ''}" style="width:${barWidth}%${pct >= 100 || barWidth === 0 ? '' : `;background-size:${(100 / barWidth) * 100}% 100%`}"></div>
            </div>
            ${body}
        `;
    }

    function refreshPaymentsBody() {
        const el = document.getElementById('paymentsBody');
        if (el && lastPaymentsCard) el.innerHTML = renderPaymentsBody(lastPaymentsCard);
    }

    // The one curated (i)-explainer this page has: what the aggregate header LINE means — how much
    // of the total contracted sum has actually been received. Deliberately does NOT talk about "the
    // next payment / due date" — that's already spelled out per-row in the list below it, in plain
    // text, so repeating it here would just be noise next to the wrong metric.
    const INFO_TEXTS = {
        payments: 'Скільки клієнт уже реально сплатив із суми за договором.',
    };

    let infoPanelEl = null;

    function closeInfoPopover() {
        if (infoPanelEl) { infoPanelEl.remove(); infoPanelEl = null; }
        window.removeEventListener('scroll', closeInfoPopover, true);
    }

    // No full-viewport scrim — a real element there (even fully transparent) sits between the
    // cursor and everything else on the page for as long as the popover is open, which is exactly
    // what a one-line tooltip must never do. Dismiss-on-outside-click instead: the delegated click
    // handler below closes it whenever a click lands outside the panel itself. Caught 2026-08-14
    // from a live report ("fine while the mouse stays over the tooltip, breaks the moment it
    // leaves") — the scrim, not any content change, was the cause all along.
    function openInfoPopover(trigger, text) {
        closeInfoPopover();
        const panel = document.createElement('div');
        panel.className = 'info-panel';
        panel.innerHTML = `${escapeHtml(text)}<button type="button" class="info-panel-close" aria-label="Закрити">✕</button>`;
        panel.querySelector('.info-panel-close').addEventListener('click', closeInfoPopover);
        document.body.appendChild(panel);
        infoPanelEl = panel;

        // Positioned once at open time under the trigger, then simply dismissed on scroll instead
        // of continuously re-tracked — the trigger sits inside a page that can scroll under a
        // position:fixed panel, and closing beats a stale/drifting position.
        const rect = trigger.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        let left = rect.left;
        if (left + panelRect.width > window.innerWidth - 16) left = window.innerWidth - panelRect.width - 16;
        if (left < 16) left = 16;
        let top = rect.bottom + 8;
        if (top + panelRect.height > window.innerHeight - 16) top = rect.top - panelRect.height - 8;
        panel.style.left = left + 'px';
        panel.style.top = Math.max(16, top) + 'px';

        window.addEventListener('scroll', closeInfoPopover, true);
    }

    document.addEventListener('click', (e) => {
        const infoTrigger = e.target.closest('[data-info]');
        if (infoTrigger) {
            const key = infoTrigger.getAttribute('data-info');
            openInfoPopover(infoTrigger, INFO_TEXTS[key] || '');
            return;
        }
        // Dismiss on any click outside the popover itself — the scrim used to do this instead.
        if (infoPanelEl && !infoPanelEl.contains(e.target)) {
            closeInfoPopover();
        }
        const toggleReceived = e.target.closest('[data-toggle-received]');
        if (toggleReceived) {
            receivedExpanded = !receivedExpanded;
            refreshPaymentsBody();
            return;
        }
        const expandToggle = e.target.closest('[data-expand-payments]');
        if (expandToggle) {
            setAllExpanded(expandToggle.getAttribute('data-expand-payments') === '1');
            refreshPaymentsBody();
        }
        // Category collapse toggle (V125 iteration). Delegated because the render can rebuild the
        // page at any point (sign, refresh) and per-row handlers would need re-binding each time.
        const sectionToggle = e.target.closest('tr.section[data-section-toggle]');
        if (sectionToggle) {
            toggleSection(sectionToggle);
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeInfoPopover();
        // Enter / Space on a focused section header behaves like a click — keyboard parity for a
        // control that carries `role="button"` + `tabindex="0"`.
        if ((e.key === 'Enter' || e.key === ' ')
                && e.target.matches && e.target.matches('tr.section[data-section-toggle]')) {
            e.preventDefault();
            toggleSection(e.target);
        }
    });

    function toggleSection(headerRow) {
        const tbody = headerRow.parentElement;
        if (!tbody || tbody.tagName !== 'TBODY') return;
        const estimateId = tbody.getAttribute('data-estimate-id');
        const category = tbody.getAttribute('data-section') || '';
        if (!estimateId) return;
        const willCollapse = !tbody.classList.contains('collapsed');
        tbody.classList.toggle('collapsed', willCollapse);
        headerRow.setAttribute('aria-expanded', willCollapse ? 'false' : 'true');
        const stored = readCollapsed(estimateId);
        if (willCollapse) stored.add(category);
        else stored.delete(category);
        writeCollapsed(estimateId, stored);
    }

    // One estimate → one section: name band (ALWAYS shown — 2026-08-14, per explicit instruction;
    // previously suppressed for a single unnamed estimate, which made the estimate's identity
    // disappear from the page entirely), items, an OPTIONAL totals block (see `showTotals` below),
    // terms and its own sign / PDF / question actions. Payments (ECONOMY only) render as their own
    // standalone top-level card via render() now, right after Зведення — never folded into a single
    // estimate's own card, so the money view stays in one place regardless of how many acts are shown.
    //
    // `showTotals` (true only when the portal has 2+ estimates — see render()): for a single
    // estimate, Зведення at the top already carries works/materials/total/discount and repeating it
    // here would just be the exact same figures twice. With several estimates, though, a client
    // scrolling through a long multi-estimate page has long lost sight of Зведення by the time they
    // reach any one estimate's item tables — restored per explicit instruction, 2026-08-14.
    function renderSection(est, showTotals) {
        const signed = est.signature != null;
        const signedBanner = signed
            ? `<p class="signed">✓ Підписано клієнтом ${est.signature.signerName ? '(' + escapeHtml(est.signature.signerName) + ')' : ''} ${dateFormat.format(new Date(est.signature.signedAt))}</p>`
            : '';
        const title = est.name ? est.name : defaultEstimateName(est);
        const api = sectionApi(est.id);

        return `
            <div class="estimate-section">
                <p class="estimate-title">${escapeHtml(title)}</p>
                ${est.validUntil ? `<p style="margin:4px 0 10px;color:var(--muted);">Дійсний до ${dateFormat.format(new Date(est.validUntil))}</p>` : ''}

                ${(() => {
                    // Computed once per estimate render — the WORK and MATERIAL passes must show
                    // the badge on the same rule (either both do or neither).
                    const showBadges = estimateHasMultipleTrades(est.items);
                    return renderItems(est.items, 'WORK', est.id, showBadges)
                         + renderItems(est.items, 'MATERIAL', est.id, showBadges);
                })()}

                ${showTotals ? `
                <section class="card">
                    <div class="totals">
                        <div class="row"><span>Сума робіт:</span><span>${money(typeBase(est.items, 'WORK', est.worksSubtotal))}</span></div>
                        <div class="row"><span>Сума матеріалів:</span><span>${money(typeBase(est.items, 'MATERIAL', est.materialsSubtotal))}</span></div>
                        <div class="row grand"><span>РАЗОМ:</span><span>${money(est.total)}</span></div>
                    </div>
                    ${adjustNote(est.markupAmount, est.discountAmount, est.markupPercent, est.discountPercent)}
                </section>
                ` : ''}

                ${est.notes ? `<section class="card"><h2>Умови</h2><p>${escapeHtml(est.notes)}</p></section>` : ''}

                <section class="card">
                    ${signedBanner}
                    <div class="actions">
                        ${isEconomy ? '' : `<button class="primary" data-sign="${escapeHtml(est.id ?? '')}" data-title="${escapeHtml(title)}" ${signed ? 'disabled' : ''}>Підписати</button>`}
                        <a class="btn" href="${api}/pdf">Завантажити PDF</a>
                        <button data-ask="${escapeHtml(est.id ?? '')}" data-title="${escapeHtml(title)}">Задати питання</button>
                    </div>
                </section>
            </div>
        `;
    }

    function render(data) {
        // The info popup lives outside #root (appended straight to document.body, so it can sit
        // position:fixed above everything) — a full re-render here does NOT remove it on its own.
        // Without this, an open popup survives into whatever replaces the page next (e.g. the
        // load() re-fetch after signing), orphaned and floating over content it no longer explains
        // — reported 2026-08-14 as "the whole page went blank except the popup" after the
        // underlying reload landed on a since-invalidated link.
        closeInfoPopover();
        // Kept so a received/expand-toggle tap can re-render just this card's body in place
        // (refreshPaymentsBody) without a full reload — toggling is a pure UI state change.
        lastPaymentsCard = data.payments || null;
        // Per-section totals block is only worth repeating when there's more than one estimate to
        // scroll past — see renderSection's own comment for why.
        const showSectionTotals = data.estimates.length > 1;

        root.innerHTML = `
            <header class="card contractor">
                ${data.contractor.logoUrl ? `<img alt="logo" src="${escapeHtml(data.contractor.logoUrl)}">` : ''}
                <div>
                    <p class="name">${escapeHtml(data.contractor.companyName)}</p>
                    <p class="phone">${escapeHtml(data.contractor.phone)}</p>
                </div>
            </header>

            <section class="card">
                <h2>Об'єкт</h2>
                <p style="margin:4px 0;"><strong>${escapeHtml(data.project.name)}</strong></p>
                <p style="margin:4px 0;color:var(--muted);">${escapeHtml(data.project.address)}</p>
                ${data.project.clientName ? `<p style="margin:4px 0;">Клієнт: ${escapeHtml(data.project.clientName)}</p>` : ''}
            </section>

            ${renderSummary(data.estimates)}

            ${data.payments ? `<section class="card"><h2>Платежі</h2><div id="paymentsBody">${renderPaymentsBody(data.payments)}</div></section>` : ''}

            ${data.estimates.length
                ? data.estimates.map((e) => renderSection(e, showSectionTotals)).join('')
                : '<section class="card"><p style="text-align:center;color:var(--muted);">Майстер ще не додав кошторисів на портал.</p></section>'}

            ${renderPhotos(data.sharedPhotos)}
        `;

        // Delegated per-section actions — ids can repeat across sections, so
        // the buttons carry their estimate id in data attributes instead.
        root.querySelectorAll('[data-sign]').forEach(b => {
            if (b.disabled) return;
            b.addEventListener('click', () => {
                dialogTarget = b.getAttribute('data-sign') || null;
                document.querySelector('#signDialog h3').textContent = 'Підписати: ' + b.getAttribute('data-title');
                openDialog('signDialog');
            });
        });
        root.querySelectorAll('[data-ask]').forEach(b => {
            b.addEventListener('click', () => {
                dialogTarget = b.getAttribute('data-ask') || null;
                document.querySelector('#questionDialog h3').textContent = 'Питання: ' + b.getAttribute('data-title');
                openDialog('questionDialog');
            });
        });
    }

    // The estimate the currently-open dialog acts on (null in legacy mode,
    // where the token itself already names the one estimate).
    let dialogTarget = null;

    function openDialog(id) { document.getElementById(id).showModal(); }
    function closeDialog(id) { document.getElementById(id).close(); }

    document.querySelectorAll('[data-close]').forEach(b => {
        b.addEventListener('click', () => closeDialog(b.getAttribute('data-close')));
    });

    // Backend ErrorResponse bodies carry localized, user-friendly messages —
    // show them when present, fall back to a generic text otherwise.
    async function apiMessage(resp) {
        try {
            const data = await resp.json();
            return data && data.message ? data.message : null;
        } catch (e) {
            return null;
        }
    }

    // The work-act (?a=) page: one signed-or-signable document. A different shape from the estimate
    // portal, so its own renderer. Honest wording — «Підтвердити приймання робіт», never «юридично
    // рівнозначно власноручному підпису» (a simple e-signature has no such presumption).
    function actDate(iso) {
        if (!iso) return '';
        const p = String(iso).slice(0, 10).split('-');
        return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
    }

    function renderAct(a) {
        closeInfoPopover();
        const signed = a.status === 'SIGNED';
        const rows = (a.items || []).map((it, i) => `
            <tr>
                <td style="text-align:right;color:var(--muted)">${i + 1}</td>
                <td>${escapeHtml(it.name)}${it.estimateName ? `<div style="font-size:12px;color:var(--muted)">${escapeHtml(it.estimateName)}</div>` : ''}</td>
                <td style="text-align:center;white-space:nowrap">${escapeHtml(it.unit)}</td>
                <td style="text-align:right;white-space:nowrap">${amount(it.quantity)}</td>
                <td style="text-align:right;white-space:nowrap">${amount(it.unitPrice)}</td>
                <td style="text-align:right;white-space:nowrap">${amount(it.lineTotal)}</td>
            </tr>`).join('');
        const advanceRow = a.advanceOffset && Number(a.advanceOffset) > 0
            ? `<div style="display:flex;justify-content:space-between"><span>Зараховано авансу</span><span>− ${money(a.advanceOffset)}</span></div>` : '';
        // Receipts & invoices the master re-bills — a row per receipt with the amount and, when
        // there is a photo, a tap-through to it. Stacked (not a table) so it reads on a phone.
        const receipts = a.receipts || [];
        // A partial return (V115) is named on its own line: the photo says 2000, the client is
        // billed 1500, and without that sentence the difference reads as an error.
        const returned = r => Number(r.returnedAmount || 0);
        const billed = r => Number(r.amount || 0) - returned(r);
        const receiptsBlock = receipts.length ? `
            <div class="card">
                <h3 style="margin:0 0 8px">Чеки та рахунки</h3>
                ${receipts.map((r, i) => `
                    <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#eee)">
                        <div style="min-width:0">
                            <div>${i + 1}. ${escapeHtml(r.label)}</div>
                            ${r.itemized ? '<div style="font-size:12px;color:var(--muted)">позиції цього чека включено в акт вище</div>' : ''}
                            ${returned(r) > 0 ? `<div style="font-size:12px;color:var(--muted)">за чеком ${money(r.amount)} · повернуто ${money(r.returnedAmount)}</div>` : ''}
                            ${r.issuedAt ? `<div style="font-size:12px;color:var(--muted)">${actDate(r.issuedAt)}</div>` : ''}
                            ${r.hasPhoto ? `<a href="${apiBase}/receipts/${encodeURIComponent(r.id)}/file" target="_blank" rel="noopener" style="font-size:13px">Переглянути фото</a>` : ''}
                        </div>
                        <div style="white-space:nowrap${r.itemized ? ';color:var(--muted)' : ''}">${money(r.itemized ? r.amount : billed(r))}</div>
                    </div>`).join('')}
                <div style="display:flex;justify-content:space-between;font-weight:600;padding-top:8px">
                    <span>Разом за чеками</span><span>${money(a.receiptsTotal)}</span>
                </div>
            </div>` : '';
        const worksAndReceiptsRows = receipts.length ? `
            <div style="display:flex;justify-content:space-between"><span>Разом за роботами</span><span>${money(a.total)}</span></div>
            <div style="display:flex;justify-content:space-between"><span>Разом за чеками</span><span>${money(a.receiptsTotal)}</span></div>` : '';
        const signBlock = signed
            ? `<div class="card" style="background:var(--ok-soft,#e8f5e9)">
                   <p style="margin:0;font-weight:600">✓ Роботи прийнято ${a.signedAt ? '· ' + actDate(a.signedAt) : ''}</p>
                   ${a.signerName ? `<p style="margin:4px 0 0;color:var(--muted)">Підписав(ла): ${escapeHtml(a.signerName)}</p>` : ''}
               </div>`
            : `<div class="card">
                   <h3 style="margin:0 0 8px">Підтвердити приймання робіт</h3>
                   <input id="actSignName" placeholder="Ваше ім'я" style="width:100%;box-sizing:border-box;margin-bottom:8px">
                   <input id="actSignPhone" placeholder="Телефон" style="width:100%;box-sizing:border-box;margin-bottom:8px">
                   <button id="actSignBtn" class="primary" style="width:100%">Підтвердити приймання робіт</button>
                   <p style="font-size:12px;color:var(--muted);margin:8px 0 0">
                     Підтвердження за посиланням — проста електронна форма згоди, а не кваліфікований
                     електронний підпис.</p>
               </div>`;
        root.innerHTML = `
            <div class="card">
                <p style="margin:0 0 4px;color:var(--muted)">${escapeHtml(a.contractorName || '')}</p>
                <h2 style="margin:0">АКТ № ${escapeHtml(a.number)} приймання-передачі виконаних робіт</h2>
                ${a.title ? `<p style="margin:2px 0 0;font-weight:600">${escapeHtml(a.title)}</p>` : ''}
                ${a.kind === 'INTERIM' && !a.title ? '<p style="margin:2px 0 0;color:var(--muted)">(проміжний)</p>' : ''}
                ${a.contractRef ? `<p style="margin:6px 0 0">За договором: ${escapeHtml(a.contractRef)}</p>` : ''}
                <p style="margin:8px 0 0">Дата складання: ${actDate(a.issuedAt)}</p>
                <p style="margin:2px 0 0">Роботи виконано в період: з ${actDate(a.periodFrom)} по ${actDate(a.periodTo)}</p>
                <p style="margin:8px 0 0">Об'єкт: ${escapeHtml(a.objectName || '')}${a.objectAddress ? ', ' + escapeHtml(a.objectAddress) : ''}</p>
                ${a.clientName ? `<p style="margin:2px 0 0">Замовник: ${escapeHtml(a.clientName)}</p>` : ''}
            </div>
            <div class="card">
                <table style="width:100%;border-collapse:collapse;font-size:14px">
                    <thead><tr style="text-align:left;color:var(--muted)">
                        <th></th><th>Найменування</th><th style="text-align:center">Од.</th>
                        <th style="text-align:right">К-сть</th><th style="text-align:right">Ціна</th><th style="text-align:right">Сума, грн</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="margin-top:12px;border-top:1px solid var(--border,#ddd);padding-top:8px">
                    ${worksAndReceiptsRows}
                    <div style="display:flex;justify-content:space-between;font-weight:600"><span>Разом за актом</span><span>${money(Number(a.total) + Number(a.receiptsTotal || 0))}</span></div>
                    ${advanceRow}
                    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>До сплати</span><span>${money(a.payable)}</span></div>
                    ${a.payableInWords ? `<p style="margin:6px 0 0;font-size:13px;color:var(--muted)">Прописом: ${escapeHtml(a.payableInWords)}</p>` : ''}
                </div>
            </div>
            ${receiptsBlock}
            ${signBlock}
            <div class="actions" style="justify-content:center;margin-top:8px">
                <a href="${apiBase}/pdf" target="_blank" rel="noopener" class="secondary" style="text-decoration:none">Завантажити PDF</a>
            </div>
        `;
        if (!signed) {
            document.getElementById('actSignBtn').addEventListener('click', async () => {
                const clientName = document.getElementById('actSignName').value.trim();
                const clientPhone = document.getElementById('actSignPhone').value.trim();
                if (!clientName || !clientPhone) return;
                const btn = document.getElementById('actSignBtn');
                btn.disabled = true;
                btn.textContent = 'Надсилаємо…';
                try {
                    const resp = await fetch(apiBase + '/sign', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clientName, clientPhone })
                    });
                    if (!resp.ok) {
                        btn.disabled = false;
                        btn.textContent = 'Підтвердити приймання робіт';
                        alert(resp.status === 409 ? 'Акт уже підписано.' : 'Не вдалося підписати. Спробуйте ще раз.');
                        return;
                    }
                    renderAct(await resp.json());
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Підтвердити приймання робіт';
                    alert('Не вдалося підписати. Перевірте інтернет і спробуйте ще раз.');
                }
            });
        }
    }

    // A failure on this page lands on the CONTRACTOR's reputation — never show
    // a blank screen or a raw error. Retryable failures get a retry button;
    // a dead link tells the client to ask the contractor for a fresh one.
    function showError(message, canRetry) {
        // Same reasoning as render() — an open info popup is appended outside #root and must not
        // survive into the error state it no longer has anything to do with.
        closeInfoPopover();
        root.innerHTML = `
            <div class="card">
                <div class="error">${escapeHtml(message)}</div>
                ${canRetry ? '<div class="actions" style="justify-content:center"><button id="btnRetry" class="primary">Спробувати ще раз</button></div>' : ''}
            </div>
        `;
        if (canRetry) {
            document.getElementById('btnRetry').addEventListener('click', () => {
                root.innerHTML = '<p>Завантаження…</p>';
                load();
            });
        }
    }

    document.getElementById('signSubmit').addEventListener('click', async () => {
        const clientName = document.getElementById('signName').value.trim();
        const clientPhone = document.getElementById('signPhone').value.trim();
        if (!clientName || !clientPhone) return;
        let resp;
        try {
            resp = await fetch(sectionApi(dialogTarget) + '/sign', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientName, clientPhone })
            });
        } catch (e) {
            alert('Немає з\'єднання. Перевірте інтернет і спробуйте ще раз.');
            return;
        }
        if (resp.ok) {
            closeDialog('signDialog');
            load();
        } else if (resp.status === 409) {
            // Already signed (e.g. opened in two tabs) — reload to show the signature.
            closeDialog('signDialog');
            alert(await apiMessage(resp) || 'Кошторис уже підписано.');
            load();
        } else {
            alert(await apiMessage(resp) || 'Не вдалося підписати. Спробуйте пізніше.');
        }
    });

    document.getElementById('qSubmit').addEventListener('click', async () => {
        const message = document.getElementById('qMessage').value.trim();
        if (!message) return;
        const body = {
            authorName: document.getElementById('qName').value.trim() || null,
            authorPhone: document.getElementById('qPhone').value.trim() || null,
            message
        };
        let resp;
        try {
            resp = await fetch(sectionApi(dialogTarget) + '/question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } catch (e) {
            // The typed message stays in the dialog — nothing is lost.
            alert('Немає з\'єднання. Перевірте інтернет і спробуйте ще раз.');
            return;
        }
        if (resp.ok) {
            closeDialog('questionDialog');
            document.getElementById('qMessage').value = '';
            alert('Дякуємо! Підрядник побачить ваше повідомлення.');
        } else {
            alert(await apiMessage(resp) || 'Не вдалося надіслати. Спробуйте пізніше.');
        }
    });

    // Adapts the legacy single-estimate response into the portal shape so there is exactly one
    // render path. No `payments` — legacy `?t=` links have no ProjectShareLink to carry the
    // toggle, so a legacy page never shows the object-level payments card.
    function adaptLegacy(data) {
        return {
            contractor: data.contractor,
            project: data.project,
            sharedPhotos: data.sharedPhotos,
            estimates: [{
                id: null,
                name: null,
                status: data.status,
                validUntil: data.validUntil,
                notes: data.notes,
                createdAt: data.createdAt,
                items: data.items,
                worksSubtotal: data.worksSubtotal,
                materialsSubtotal: data.materialsSubtotal,
                total: data.total,
                markupAmount: data.markupAmount,
                discountAmount: data.discountAmount,
                markupPercent: data.markupPercent,
                discountPercent: data.discountPercent,
                signature: data.signature
            }]
        };
    }

    async function load() {
        try {
            const resp = await fetch(apiBase);
            if (resp.status === 404) {
                showError('Посилання недійсне або прострочене. Зверніться до вашого майстра за новим посиланням.', false);
                return;
            }
            if (!resp.ok) {
                showError('Не вдалося завантажити кошторис. Спробуйте ще раз за хвилину.', true);
                return;
            }
            const data = await resp.json();
            // The act view (?a=) is a different document shape entirely — its own render branch,
            // BEFORE adaptLegacy, which expects the estimate shape and would render garbage.
            if (actToken) {
                renderAct(data);
            } else {
                render((portalToken || economyToken) ? data : adaptLegacy(data));
            }
        } catch (e) {
            showError('Не вдалося завантажити кошторис. Перевірте інтернет-з\'єднання і спробуйте ще раз.', true);
        }
    }

    load();
})();
</script>
</body>
</html>
